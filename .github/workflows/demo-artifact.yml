name: Build demo artifact

# A maintainer may prepare a downloadable build. This never publishes a site.
on:
  workflow_dispatch:
    inputs:
      base_path:
        description: 'Hosting path, including leading and trailing slashes'
        required: true
        default: '/wonders-ex-fan-game/'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build:demo
        env:
          DEMO_BASE_PATH: ${{ inputs.base_path }}
      - uses: actions/upload-artifact@v4
        with:
          name: wonders-ex-fan-game-demo
          path: dist-demo/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
